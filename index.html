<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📝 To-Do List</h1>
        <p>Catat semua tugasmu di sini!</p>

        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Masukkan tugas...">
            <button onclick="tambahTugas()">Tambah</button>
        </div>

        <ul id="taskList"></ul>

        <button class="hapus-semua" onclick="hapusSemua()">
            Hapus Semua
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
